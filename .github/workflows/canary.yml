name: Live site canary

# Reads the body of the live pages, not just their status code.
#
# The 2026-09-05 outage served a 141-byte "restore-pending" stub with HTTP 200
# for three and a half hours. Any probe watching status codes saw a healthy
# site the whole time. This one fails when the page is blank.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-site-canary
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Probe the live site
        run: bash scripts/probe-live-site.sh
      - name: Probe production endpoints
        run: bash scripts/probe-production-endpoints.sh
      - name: Open or update outage alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production canary failure';
            const body = [
              'The scheduled production canary detected a failure.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'Investigate the live response before closing this issue.'
            ].join('\n');
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 10
            });
            const existing = openIssues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
